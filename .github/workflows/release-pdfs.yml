name: Build and release PDFs

on:
  push:
    branches: ['**']
    paths:
      - '**/*.typ'
      - '**/*.org'
      - '**/*.py'
      - '**/*.nix'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - 'flake.lock'
      - '.github/workflows/release-pdfs.yml'
  pull_request:
    paths:
      - '**/*.typ'
      - '**/*.org'
      - '**/*.py'
      - '**/*.nix'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - 'flake.lock'
      - '.github/workflows/release-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - name: Build all PDFs with locked fonts and Typst packages
        run: nix build .#pdfs --out-link result --print-build-logs
      - name: Verify release files
        run: |
          cd result
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-pdfs
          path: result/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-pdfs
          path: release
      - name: Verify downloaded PDFs and archives
        run: |
          cd release
          sha256sum --check SHA256SUMS
      - name: Update rolling PDF release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish-release.py --directory release
